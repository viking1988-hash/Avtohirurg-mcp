name: Avtohirurg MCP check

on:
  push:
    branches: ["main", "jarvis-mcp-runtime"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: jarvis_return_queue_test
          POSTGRES_USER: jarvis_sandbox
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_sandbox -d jarvis_return_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral CI service only. Never point this variable at Railway/production.
      JARVIS_CI_DATABASE_URL: postgresql://jarvis_sandbox:ci-only-password@localhost:5432/jarvis_return_queue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile server.py wordpress_client.py ai_admin.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
