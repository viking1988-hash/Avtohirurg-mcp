name: Prometheus backup archive validator
on:
  pull_request:
    paths:
      - 'ops/prometheus/**'
      - '.github/workflows/prometheus-backup-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline archive validation tests
        run: python -m unittest discover -s ops/prometheus/tests -v
