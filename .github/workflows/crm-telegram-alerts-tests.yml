name: CRM Telegram alerts isolated tests
on:
  pull_request:
    paths:
      - 'crm-telegram-alerts/**'
      - '.github/workflows/crm-telegram-alerts-tests.yml'
  workflow_dispatch:
jobs:
  mocked-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check crm-telegram-alerts/index.mjs
      - name: Test with mocked database and Telegram
        run: node crm-telegram-alerts/index.test.mjs
      - name: Test staging outbox safety contract
        run: node --test crm-telegram-alerts/staging/outbox.test.mjs
