name: CRM Telegram alerts isolated tests
on:
  pull_request:
    paths:
      - 'crm-telegram-alerts/**'
      - '.github/workflows/crm-telegram-alerts-tests.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install worker dependency
        working-directory: crm-telegram-alerts
        run: npm install --no-save --no-package-lock
      - name: Check worker and test syntax
        run: |
          node --check crm-telegram-alerts/index.mjs
          node --check crm-telegram-alerts/delivery-v2.mjs
          node --check crm-telegram-alerts/operator.mjs
          node --check crm-telegram-alerts/test/worker-e2e-postgres.test.mjs
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_local_only
          POSTGRES_DB: alerts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d alerts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install worker dependency
        working-directory: crm-telegram-alerts
        run: npm install --no-save --no-package-lock
      - name: Seed legacy delivery history before migration
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test_user
          PGPASSWORD: test_password_local_only
          PGDATABASE: alerts_test
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE TABLE crm_telegram_alert_log (lead_id bigint NOT NULL, alert_type text NOT NULL, sent_at timestamptz NOT NULL DEFAULT now(), PRIMARY KEY (lead_id, alert_type))"
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO crm_telegram_alert_log (lead_id, alert_type, sent_at) VALUES (980001, 'new', '2026-10-01T12:00:00Z')"
      - name: Apply additive migration twice and verify legacy history is unchanged
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: test_user
          PGPASSWORD: test_password_local_only
          PGDATABASE: alerts_test
        run: |
          psql -X -v ON_ERROR_STOP=1 -f crm-telegram-alerts/migrations/001_delivery_v2.sql
          psql -X -v ON_ERROR_STOP=1 -f crm-telegram-alerts/migrations/001_delivery_v2.sql
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM crm_telegram_alert_log WHERE lead_id=980001 AND alert_type='new' AND sent_at='2026-10-01T12:00:00Z') THEN RAISE EXCEPTION 'legacy delivery history changed'; END IF; END \$\$;"
      - name: Run worker E2E against PostgreSQL and local mock Telegram
        env:
          DATABASE_URL: postgres://test_user:test_password_local_only@localhost:5432/alerts_test
        run: node crm-telegram-alerts/test/worker-e2e-postgres.test.mjs
