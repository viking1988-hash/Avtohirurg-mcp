name: CRM Telegram alerts check
on:
  push:
    branches: [fix/telegram-alerts-safety-20261009]
  pull_request:
    paths:
      - 'crm-telegram-alerts/**'
      - '.github/workflows/crm-telegram-alerts-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check crm-telegram-alerts/index.mjs
      - run: node --test crm-telegram-alerts/safety.test.mjs
