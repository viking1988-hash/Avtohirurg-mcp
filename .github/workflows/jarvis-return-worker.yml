name: Jarvis Return Worker
on:
  push:
    branches: ['feat/jarvis-return-worker-*', 'feat/jarvis-telegram-transport-*']
  pull_request:
    paths: ['jarvis-return-worker/**', '.github/workflows/jarvis-return-worker.yml']
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: jarvis_return_queue_test
          POSTGRES_USER: jarvis_sandbox
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r jarvis-return-worker/requirements.txt pytest httpx
      - run: |
          python - <<'CODE'
          import os, subprocess
          from urllib.parse import urlunsplit
          env = dict(os.environ)
          env['JARVIS_WORKER_CI_DATABASE_URL'] = urlunsplit(('postgresql', 'jarvis_sandbox@localhost:5432', '/jarvis_return_queue_test', '', ''))
          subprocess.run(['pytest', '-q', 'jarvis-return-worker/tests', '--junitxml=worker-test-results.xml'], env=env, check=True)
          CODE
      - name: Verify receipt survives PostgreSQL restart
        run: |
          export JARVIS_WORKER_CI_DATABASE_URL='postgresql://jarvis_sandbox@localhost:5432/jarvis_return_queue_test'
          python - <<'PY'
          import importlib.util, pathlib, sys
          package = pathlib.Path('jarvis-return-worker')
          spec = importlib.util.spec_from_file_location('jarvis_return_worker', package/'__init__.py',
              submodule_search_locations=[str(package)])
          module = importlib.util.module_from_spec(spec)
          sys.modules['jarvis_return_worker'] = module
          spec.loader.exec_module(module)
          from datetime import datetime, timedelta, timezone
          from types import SimpleNamespace
          from jarvis_return_worker.queue import QueueRepository
          from jarvis_return_worker.transport import FakeTransport
          url = __import__('os').environ['JARVIS_WORKER_CI_DATABASE_URL']
          repo = QueueRepository(SimpleNamespace(database_url=url, worker_id='restart-ci', lease_seconds=30,
              heartbeat_seconds=5, max_attempts=3))
          repo.migrate()
          task_id = 'ci-postgres-restart-probe'
          row = repo.enqueue(task_id, 'sandbox:restart-probe', 'restart-check', task_id)
          repo.approve(task_id, row['action_fingerprint'], datetime.now(timezone.utc)+timedelta(minutes=5), 'ci-human')
          task = repo.claim('restart-ci')
          repo.mark_delivery_started(task_id, 'restart-ci', task['attempt_count'])
          receipt = FakeTransport(repo, 'restart-ci').deliver(task)
          repo.save_delivery_receipt(task_id, 'restart-ci', task['attempt_count'], receipt, 'restart-probe-message')
          repo.finish(task_id, 'restart-ci', task['attempt_count'], receipt)
          PY
          container_id="$(docker ps -q --filter ancestor=postgres:18 | head -n1)"
          test -n "$container_id"
          docker restart "$container_id"
          for attempt in $(seq 1 20); do
            docker exec "$container_id" pg_isready -U jarvis_sandbox -d jarvis_return_queue_test && break
            sleep 1
          done
          docker exec "$container_id" pg_isready -U jarvis_sandbox -d jarvis_return_queue_test
          python - <<'PY'
          import importlib.util, pathlib, sys
          package = pathlib.Path('jarvis-return-worker')
          spec = importlib.util.spec_from_file_location('jarvis_return_worker', package/'__init__.py',
              submodule_search_locations=[str(package)])
          module = importlib.util.module_from_spec(spec)
          sys.modules['jarvis_return_worker'] = module
          spec.loader.exec_module(module)
          import os
          from types import SimpleNamespace
          from jarvis_return_worker.queue import QueueRepository
          repo = QueueRepository(SimpleNamespace(database_url=os.environ['JARVIS_WORKER_CI_DATABASE_URL'],
              worker_id='restart-ci', lease_seconds=30, heartbeat_seconds=5, max_attempts=3))
          task_id = 'ci-postgres-restart-probe'
          row = repo.get(task_id)
          assert row['state'] == 'DONE'
          assert row['external_message_id'] == 'restart-probe-message'
          assert repo.claim('after-restart') is None

          from jarvis_return_worker.outbox import OutboxReplay, SubscriberRegistry
          from jarvis_return_worker.app import _create_dispatch_intent
          from psycopg.types.json import Jsonb
          def project(conn, event):
              conn.execute("""INSERT INTO jarvis_event_projection
                  (event_id,subscriber_name,aggregate_id,event_type,event_version,payload)
                  VALUES (%s,'jarvis.ci.restart-projection',%s,%s,%s,%s)
                  ON CONFLICT (event_id,subscriber_name) DO NOTHING""",
                  (event['event_id'],event['aggregate_id'],event['event_type'],
                   event['event_version'],Jsonb(event['payload'])))
          registry = SubscriberRegistry()
          registry.register('jarvis.ci.restart-projection','*',project)
          registry.register('jarvis.dispatcher-intent','TaskApproved',_create_dispatch_intent)
          replay = OutboxReplay(repo,registry,owner='postgres-restart-ci')
          replay.register_subscribers()
          replayed = 0
          while replay.replay_one():
              replayed += 1
          assert replayed > 0
          assert replay.replay_one() is False
          with repo.connection() as conn:
              durable = conn.execute("""SELECT count(*) AS n FROM jarvis_outbox_events
                  WHERE aggregate_id=%s AND event_type='TaskFinished' AND status='PUBLISHED'""",
                  (task_id,)).fetchone()['n']
              projected = conn.execute("""SELECT count(*) AS n FROM jarvis_event_projection p
                  JOIN jarvis_outbox_events e USING(event_id)
                  WHERE e.aggregate_id=%s AND e.event_type='TaskFinished'
                    AND p.subscriber_name='jarvis.ci.restart-projection'""",
                  (task_id,)).fetchone()['n']
              assert durable == projected == 1
          print('PostgreSQL restart recovery check: task receipt and outbox event survived; replay exactly once')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-test-results
          path: worker-test-results.xml
