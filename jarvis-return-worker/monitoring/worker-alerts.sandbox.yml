groups:
  - name: jarvis-worker-private-sandbox
    rules:
      - alert: JarvisWorkerUnavailable
        expr: up{job="jarvis-sandbox-worker"} == 0
        for: 2m
        labels:
          severity: warning
          environment: staging
        annotations:
          summary: Sandbox Worker metrics scrape unavailable
      - alert: PrometheusBackupHelperUnavailable
        expr: up{job="prometheus-backup-helper"} == 0
        for: 2m
        labels:
          severity: critical
          environment: staging
        annotations:
          summary: Prometheus backup helper is unavailable
      - alert: PrometheusBackupNeverSucceeded
        expr: prometheus_backup_last_success_timestamp_seconds{job="prometheus-backup-helper"} == 0
        for: 10m
        labels:
          severity: critical
          environment: staging
        annotations:
          summary: No verified Prometheus staging backup yet
      - alert: PrometheusBackupStale
        expr: time() - prometheus_backup_last_success_timestamp_seconds{job="prometheus-backup-helper"} > 93600
        for: 10m
        labels:
          severity: critical
          environment: staging
        annotations:
          summary: Prometheus staging backup is older than 26 hours
      - alert: PrometheusBackupVerificationFailed
        expr: increase(prometheus_backup_failures_total{job="prometheus-backup-helper"}[1h]) > 0
        labels:
          severity: warning
          environment: staging
        annotations:
          summary: Prometheus backup upload or restore verification failed
      - alert: PrometheusBackupVolumeLow
        expr: prometheus_backup_volume_free_bytes{job="prometheus-backup-helper"} < 134217728
        for: 5m
        labels:
          severity: warning
          environment: staging
        annotations:
          summary: Prometheus backup volume has less than 128 MiB free
