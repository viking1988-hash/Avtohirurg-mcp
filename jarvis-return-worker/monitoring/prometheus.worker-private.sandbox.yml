global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/worker-alerts.yml

scrape_configs:
  - job_name: jarvis-sandbox-worker
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /tmp/worker-metrics-token
    static_configs:
      - targets: ['jarvis-worker-metrics-sandbox.railway.internal:8080']

# Same-project, private-only Worker monitoring.
# No cross-project Alertmanager and no synthetic fixture references.
# Notifications must be enabled only after a same-project receiver is deployed.
